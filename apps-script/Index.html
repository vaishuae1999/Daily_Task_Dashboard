<!doctype html><html><head><base target="_top"><style>
body{font:15px system-ui;background:#f4f7fc;color:#18243a;margin:0}main{max-width:1200px;margin:auto;padding:28px}h1{margin:0}header,.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.card{background:white;padding:22px;border:1px solid #dae1ed;border-radius:12px;margin:16px 0}button,input,select,textarea{font:inherit;border:1px solid #cbd5e3;border-radius:6px;padding:9px;background:white}button{cursor:pointer}button.primary{background:#2455d6;color:white}button:disabled{opacity:.5}label{display:grid;gap:5px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}textarea{min-height:70px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e3e8f0;max-width:240px;overflow-wrap:anywhere}small{color:#65738a}#notice{white-space:pre-wrap;color:#334d7a}dialog{border:1px solid #cad4e3;border-radius:12px;max-width:700px;width:85%;max-height:85vh;overflow:auto}#tablewrap{overflow:auto}#search{flex:1}a{color:#2455d6}@media(max-width:600px){form{grid-template-columns:1fr}main{padding:14px}}</style></head><body><main>
<header><div><h1>Daily Support Desk</h1><small id="identity">Checking account…</small></div></header>
<div class="card"><strong>Google Drive master records</strong><p>Changes save directly to the configured Google Sheet. Your original Excel workbook is not modified.</p><small id="backup">Loading backup status…</small></div>
<div class="bar"><button id="new" class="primary">New task</button><button id="reload">Refresh</button><button id="trash">View Trash</button><button id="export">Export JSON</button><button id="backupBtn">Back up now</button><label>Import reviewed JSON <input id="import" type="file" accept=".json"></label></div>
<p id="notice" role="status" aria-live="polite"></p><div class="bar"><input id="search" aria-label="Search" placeholder="Search customer, order, issue…"><select id="agent" aria-label="Agent"><option value="">All agents</option><option>Akshay</option><option>Vaishnavi</option></select></div>
<div class="card" id="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Order</th><th>Channel</th><th>Issue</th><th>Agent</th><th>Original status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<dialog id="editor"><h2 id="title">Task</h2><form id="form"></form><p id="formError" role="alert"></p><div class="bar"><button id="save" class="primary">Save</button><button id="cancel">Cancel</button></div></dialog>
</main><script>
const $=id=>document.getElementById(id);let tasks=[],trash=false,current={},busy=false;
const fields={date:'Date',customer:'Customer name',email:'Email',phone:'Phone',orderId:'Order ID',channel:'Channel',issue:'Issue',action:'Action points',agent:'Agent',status:'Original status',awb:'AWB',followUpDate:'Follow-up date',callingDate:'Calling date',address:'Address'};
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));}
function notice(s){$('notice').textContent=s;}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b;}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){notice(e.message||String(e));$('formError').textContent=e.message||String(e);}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function load(){tasks=await call('listTasks',trash);render();$('trash').textContent=trash?'View active tasks':'View Trash';}
function render(){const q=$('search').value.toLowerCase(),agent=$('agent').value;const body=$('rows');body.replaceChildren();const filtered=tasks.filter(t=>(!agent||t.agent===agent)&&[t.customer,t.orderId,t.issue,t.email].join(' ').toLowerCase().includes(q));filtered.forEach(t=>{const tr=document.createElement('tr');['date','customer','orderId','channel','issue','agent','status'].forEach(k=>{const td=document.createElement('td');td.textContent=t[k]||'—';tr.append(td)});const td=document.createElement('td');if(!trash)td.append(button('Edit',()=>edit(t)));td.append(button(trash?'Restore':'Move to Trash',()=>run(async()=>{if(!trash&&!confirm('Move this task to Trash?'))return;await call('setTrash',t.id,t.version,trash);await load();notice('Saved.');})));tr.append(td);body.append(tr);});if(!filtered.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.textContent='No matching records.';tr.append(td);body.append(tr);}}
function edit(t={}){current={...t};$('form').replaceChildren();$('formError').textContent='';for(const [key,label] of Object.entries(fields)){const l=document.createElement('label');l.textContent=label;let input;if(key==='agent'){input=document.createElement('select');['','Akshay','Vaishnavi'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v||'Unassigned';input.append(o);});}else{input=document.createElement(['issue','action','address'].includes(key)?'textarea':'input');if(input.tagName==='INPUT')input.type=key.toLowerCase().includes('date')?'date':key==='email'?'email':'text';}input.name=key;input.value=t[key]||'';input.required=['customer','issue','channel'].includes(key);l.append(input);$('form').append(l);}$('editor').showModal();}
$('save').onclick=()=>run(async()=>{if(!$('form').reportValidity())return;const t={...current,...Object.fromEntries(new FormData($('form')))};notice('Saving…');await call('saveTask',t);$('editor').close();await load();notice('Saved to Google Sheet.');});$('cancel').onclick=()=>$('editor').close();$('new').onclick=()=>edit();$('reload').onclick=()=>run(load);$('trash').onclick=()=>run(async()=>{trash=!trash;await load();});$('search').oninput=render;$('agent').onchange=render;
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=trash?'support-trash.json':'support-tasks.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Exported the current active/Trash dataset. Search filters do not restrict this export.');};
$('backupBtn').onclick=()=>run(async()=>{const result=await call('backupNow');notice('Backup created: '+result.name);$('backup').textContent='Last successful backup: '+new Date().toLocaleString();});
$('import').onchange=()=>run(async()=>{const f=$('import').files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('Maximum JSON file size: 10 MB.');const rows=JSON.parse(await f.text());if(!Array.isArray(rows)||!rows.length)throw Error('Choose a nonempty ready-XXX.json batch from the preparation tool.');if(rows.length>500)throw Error('Maximum 500 rows per batch.');if(!confirm('Import '+rows.length+' reviewed records? Existing source keys will be skipped.'))return;const r=await call('importTasks',rows);await load();notice('Imported '+r.imported+'; skipped '+r.skipped+' existing source records.');}finally{$('import').value='';}});
run(async()=>{const s=await call('getStatus');$('identity').textContent=s.email+' · '+s.role;$('backup').textContent='Last successful backup: '+(s.lastBackup||'Never')+'. Weekly trigger for this account: '+(s.weeklyBackupInstalled?'installed':'not installed');await load();notice('Connected to Google Sheet.');});
</script></body></html>
